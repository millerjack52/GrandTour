[SystemSettings]
; Bounded perceived-detail review: retain thin foliage during TSR reconstruction.
; See FirstSection/Review/PerceivedDetail for measured cost; remove to restore default.
r.TSR.ThinGeometryDetection=1
; Owner requested no volumetric clouds. Keep the sky dome, atmosphere and haze.
; Runtime toggle also disables the volumetric-cloud shadow/AO rendering path.
r.VolumetricCloud=0
; UE 5.8 cached Lumen/sky lighting: EV -4..16 covers Benmore daylight (13.2)
; and the existing weather presets. Storage pre-exposure only, not camera EV.
r.EyeAdaptation.CachedLightingPreExposure=8
; Benmore memory stage 1 trial: 2048 vs Epic's 4096 physical shadow pages.
; Comparison/overflow and visual gates pending; remove this override to roll back.
; Keeps hardware Lumen, water detail, grass density and camera resolution intact.
r.Shadow.Virtual.MaxPhysicalPages=2048
; Benmore optimisation BO1 (docs/BENMORE_OPTIMISATION_PLAN.md): no Lumen surface-cache cards for grass clumps,
; spray spheres and stones (a card face smaller than 150x150 cm). Shrubs, rocks over 1.5 m, willows and the
; landscape keep theirs. Removes the 25 card captures per frame measured 2026-10-10. Delete this line to roll back.
r.LumenScene.SurfaceCache.MeshCardsMinSize=150
; Benmore memory stages, measured independently at Ford (PERFORMANCE_AUDIT).
; Provisional pending other locations/moving review; remove these three lines
; to restore engine defaults: atlas 4096, Nanite pool 512, TSR history 200.
; Atlas retains card texel detail; 34/256 pages occupied in the measured view.
r.LumenScene.SurfaceCache.AtlasSize=2048
r.Nanite.Streaming.StreamingPoolSize=128
r.TSR.History.ScreenPercentage=100
; Clean painterly assets: no full-screen banding, stroke warp or Kuwahara filter.
; Keep the runtime fixed-exposure volume enabled.
gt.Look.Post=2
gt.Look.WarpScale=0
gt.Look.Kuwahara=0
; Leg dressing LD7 cut step 3 (docs/LEG_DRESSING_PLAN.md LD7, the cut order): every landscape grass cull distance x 0.6
; (the OW LGT assets untouched; a dial, 1 = the LGT values). SystemSettings outranks the FoliageQuality scalability group.
grass.CullDistanceScale=0.6
; Leg dressing LD7 cut step 4: every landscape grass density x 0.5 (the LGT assets untouched; a dial, 1 = the LGT values).
grass.DensityScale=0.5
